<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | GlowCart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 18px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }
        .cart-item img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }
        .cart-info { flex: 1; }
        .cart-item button {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 4px;
        }
        .remove-btn { background: #f8dce5; color: #91445e; }
        .checkout-btn {
            display: inline-block;
            background: #b65c79;
            color: white;
            padding: 13px 25px;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 15px;
        }
        .cart-total {
            text-align: right;
            margin-top: 25px;
        }
        @media(max-width: 600px) {
            .cart-item { flex-wrap: wrap; }
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <nav class="navbar">
        <h1 class="logo">GlowCart<span>.</span></h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="orders.html">My Orders</a></li>
        </ul>
    </nav>
</header>

<main class="cart-container">
    <h2>My Shopping Cart 🛒</h2>

    <div id="cart-items"></div>

    <div class="cart-total">
        <h2>Total: ₹<span id="cart-total">0</span></h2>
        <a href="checkout.html" class="checkout-btn">
            Proceed to Checkout →
        </a>
    </div>
</main>

<footer>
    <p>© 2026 GlowCart. All Rights Reserved.</p>
</footer>

<script>
function renderCartPage() {
    const cart = JSON.parse(localStorage.getItem("glowcart")) || [];
    const container = document.getElementById("cart-items");
    let total = 0;

    container.innerHTML = "";

    if (cart.length === 0) {
        container.innerHTML = "<h3>Your cart is empty!</h3><a href='products.html'>Shop Now</a>";
        document.getElementById("cart-total").textContent = "0";
        return;
    }

    cart.forEach(item => {
        total += item.price * item.quantity;

        container.innerHTML += `
            <div class="cart-item">
                <img src="${item.image}" alt="${item.name}">
                <div class="cart-info">
                    <h3>${item.name}</h3>
                    <p>Price: ₹${item.price}</p>
                    <p>Quantity: ${item.quantity}</p>
                    <button onclick="changeQuantity(${item.id}, -1)">−</button>
                    <button onclick="changeQuantity(${item.id}, 1)">+</button>
                    <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
                </div>
            </div>
        `;
    });

    document.getElementById("cart-total").textContent = total;
}

function changeQuantity(id, change) {
    let cart = JSON.parse(localStorage.getItem("glowcart")) || [];
    const item = cart.find(product => product.id === id);

    if (!item) return;

    item.quantity += change;

    if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== id);
    }

    localStorage.setItem("glowcart", JSON.stringify(cart));
    renderCartPage();
}

function removeItem(id) {
    let cart = JSON.parse(localStorage.getItem("glowcart")) || [];
    cart = cart.filter(item => item.id !== id);

    localStorage.setItem("glowcart", JSON.stringify(cart));
    renderCartPage();
}

renderCartPage();
</script>

</body>
</html>
